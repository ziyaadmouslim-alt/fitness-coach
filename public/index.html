<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="My Fitness Coach">
<meta name="theme-color" content="#0a0b0a"><link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="/icons/splash-1179x2556.png" media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<title>My Fitness Coach</title>
<style>
:root{--bg:#0a0b0a;--card:#151816;--c2:#202521;--g:#3ddc84;--gd:#0f3a22;--tx:#eef2ee;--mut:#8d968f;--warn:#ffb74d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:18px 16px 110px}
h1{font-size:30px;line-height:1.1;margin:4px 0 6px;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;margin:22px 0 10px;font-weight:700}
h3{font-size:17px;margin:0 0 4px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid #232823;border-radius:20px;padding:16px;margin:12px 0}
.hero{background:linear-gradient(160deg,var(--gd),var(--card) 70%);border-color:#1f5a38}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--gd);color:var(--g);font-size:13px;font-weight:600}
.pill.rest{background:#2a2540;color:#b8a9ff}
button{font:inherit;color:var(--tx);border:0;border-radius:16px;padding:14px 18px;background:var(--c2);cursor:pointer;min-height:50px;transition:transform .12s}
button:active{transform:scale(.97)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:2px}
button.p{background:var(--g);color:#04170c;font-weight:800;width:100%}
button.big{font-size:22px;padding:22px;margin-top:14px;box-shadow:0 0 0 0 rgba(61,220,132,.5);animation:pulse 2.4s infinite}
button:disabled{opacity:.4}
@keyframes pulse{70%{box-shadow:0 0 0 14px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
@media (prefers-reduced-motion:reduce){button.big{animation:none}.fig{animation:none!important}}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
ul{padding-left:20px;margin:6px 0}li{margin:3px 0}
.ex{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #232823}.ex:last-child{border:0}
.ex b{font-weight:600}.ex span{color:var(--g);font-weight:700;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(14,16,14,.94);backdrop-filter:blur(14px);border-top:1px solid #232823;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border-radius:12px;padding:6px 0;min-height:52px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:22px}nav button.on{color:var(--g)}
details{background:var(--c2);border-radius:14px;padding:10px 14px;margin:8px 0}summary{cursor:pointer;font-weight:600;min-height:28px}
.stat{text-align:center;padding:14px 6px}.stat b{display:block;font-size:30px;color:var(--g);line-height:1.1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;color:var(--mut)}
.wk div div{height:38px;border-radius:12px;background:var(--c2);display:grid;place-items:center;margin-top:4px;font-size:16px}
.wk .d div{background:var(--g);color:#04170c}.wk .t div{outline:2px solid var(--g)}
.run{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.run>div{max-width:520px;margin:0 auto}
.fig{font-size:92px;text-align:center;background:var(--c2);border-radius:24px;padding:22px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) scale(1.04)}}
.bar{height:6px;background:var(--c2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.chips{display:flex;gap:8px;margin:10px 0}.chips i{flex:1;height:12px;border-radius:9px;background:var(--c2)}.chips i.f{background:var(--g)}
.timer{font-size:56px;font-weight:800;text-align:center;color:var(--g)}
.warn{background:#2b2312;border-color:#5a4619;color:#ffe2a8}
input[type=time],input[type=text],input[type=number],select{font:inherit;background:var(--c2);color:var(--tx);border:1px solid #2c332d;border-radius:12px;padding:12px;width:100%;min-height:48px}
.link{background:none;color:var(--mut);text-decoration:underline;width:100%;font-size:14px}
</style></head><body>
<div id="app"></div>
<nav id="nav"></nav>
<div class="run" id="run" hidden></div>
<script>
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const E={
incline:['Incline Push-ups','🧎','Hands on a sturdy table, counter or sofa edge, body in one straight line. Lower your chest toward the edge, then press away.','Sagging hips, flaring elbows wide, going too fast.'],
knee:['Knee Push-ups','🙇','Knees on a mat, hands under shoulders, straight line from knees to head. Lower with control and push up.','Hips pushed back, head dropping, partial reps.'],
pike:['Pike Push-ups','🔺','Make an upside-down V with hips high. Bend elbows to lower the top of your head toward the floor, then press back up.','Going too deep too soon, locking elbows hard, rounding the back.'],
wall:['Wall Push-ups','🧱','Stand an arm’s length from a wall, hands on it at chest height. Bend elbows to bring your chest to the wall, then push away.','Feet too close to the wall, arching the lower back.'],
squat:['Squats','🦵','Feet shoulder-width apart. Sit your hips back and down like onto a chair, chest tall, knees over toes. Stand up by pushing through your heels.','Knees caving in, heels lifting, rounding the back.'],
lunge:['Reverse Lunges','🚶','Step one foot back and lower until both knees bend about 90°. Push through the front heel to return. Hold a wall for balance if needed.','Front knee drifting past toes, leaning forward, tiny steps.'],
bridge:['Glute Bridge','🌉','Lie on your back, knees bent, feet flat. Push through heels to lift hips until shoulders, hips and knees form a line. Squeeze, then lower slowly.','Arching the lower back, pushing through toes.'],
calf:['Calf Raises','🦶','Stand tall, hold a wall if needed. Rise onto your toes, pause one second, lower slowly.','Bouncing, rolling the ankles outward.'],
deadbug:['Dead Bug','🪲','Lie on your back, arms up, knees bent over hips. Lower the opposite arm and leg slowly, keeping your lower back on the floor. Switch sides.','Lower back lifting off the floor, moving too fast, holding your breath.'],
ytw:['Prone Y-T-W Raises','🛩️','Lie face down, forehead on the floor. Lift arms into a Y, then a T, then a W, squeezing your shoulder blades. One of each is one rep.','Shrugging shoulders to your ears, lifting with the neck.'],
snow:['Reverse Snow Angels','👼','Lie face down, arms by your sides. Sweep arms in a wide arc overhead and back, hovering just above the floor.','Lifting the head, bending the elbows, rushing.'],
bird:['Bird Dog','🐕','On hands and knees, reach one arm forward and the opposite leg back, keeping hips level. Hold one second, switch.','Twisting the hips, arching the back, swinging the leg high.'],
super:['Gentle Superman','🦸','Lie face down, lift arms and legs only a few centimetres, gently. Skip this one if your lower back feels uncomfortable.','Lifting high, craning the neck, forcing it through discomfort.'],
march:['Marching in Place','🥁','Stand tall and march, lifting knees to hip height with swinging arms. Breathe steadily.','Slouching, slamming feet down, holding your breath.']
};
const W={
1:{n:'PUSH DAY',e:'💪',ex:[['incline',3,10],['knee',2,8],['pike',2,6],['wall',2,12]],msg:'💪 Monday Workout! Today is PUSH DAY. Open your fitness coach and start your workout!'},
2:{n:'LEGS & CORE',e:'🔥',ex:[['squat',3,12],['lunge',2,8,' per leg'],['bridge',3,12],['calf',2,15],['deadbug',2,8,' per side']],msg:'🔥 Today’s workout: LEGS & CORE. Your training session is waiting!'},
4:{n:'BACK & POSTURE',e:'🧘',ex:[['ytw',2,8],['snow',2,10],['bird',2,8,' per side'],['super',2,8]],msg:'💪 BACK & POSTURE DAY! Let’s work on strength and posture.'},
6:{n:'FULL BODY & FITNESS',e:'⚡',ex:[['squat',2,12],['incline',2,10],['bird',2,8,' per side'],['calf',2,15],['march',3,30,' sec']],msg:'⚡ FULL BODY DAY! Let’s get moving!'}
};
const RESTMSG='😴 Recovery Day! Take a rest and eat balanced meals.';
const WARM=[['Arm circles','30 seconds forward, 30 seconds back'],['Shoulder rolls','10 slow rolls backward'],['Torso twists','10 gentle twists each way'],['Hip circles','10 each direction'],['Light marching','1 minute, easy pace']];
const MOT=['Small steps every day build a strong body.','Good form beats more reps. Quality first.','Rest is when your body grows stronger.','Consistency wins. Show up and do your best today.','Listen to your body. Smart training lasts.','You are building habits that will serve you for life.'];
const MEALS=[
['Breakfast','🍳','Eggs, bread and milk','2 eggs, 1–2 slices of bread, 1 glass of milk, 1 banana','Scramble or boil the eggs. Serve with bread, a banana and a glass of milk.','Yogurt with oats and fruit; or msemen with a boiled egg'],
['Morning snack','🍌','Banana and nuts','1 banana, a small handful of almonds or walnuts','Eat together. Carry them to school or keep them handy.','Apple with peanut butter; or a yogurt'],
['Lunch','🍚','Chicken, rice and vegetables','Chicken, rice, carrots, zucchini, tomato, olive oil','Cook the chicken with vegetables and light spices. Serve over rice with a salad.','Fish with potatoes; or lentils with rice (a great plant protein)'],
['Afternoon snack','🥛','Yogurt and fruit','1 yogurt, seasonal fruit such as orange or strawberries','Chop the fruit into the yogurt.','Bread with cheese; or dates with a glass of milk'],
['Dinner','🍲','Lentil soup with bread','Lentils, onion, carrot, tomato, cumin, bread, a piece of fruit','Simmer lentils with the vegetables until soft. Season and serve with bread.','Baked fish with potatoes and salad; or an omelette with vegetables']
];
let S={done:{},notif:{on:false,time:'18:00',last:''},allergies:'',prefs:'',log:{},cf:[],water:{},prof:{age:14,h:156,w:41,level:'Complete beginner',equip:'No equipment',loc:'Home',goals:'Build strength, develop balanced muscles, improve fitness and posture, support healthy growth and recovery',aAt:'',hAt:'',wAt:''}};
try{const x=JSON.parse(localStorage.getItem('fc2')||'null');if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem('fc2',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const $=s=>document.querySelector(s);
let tab='home',unlock=false;
const wmin=w=>5+Math.round(w.ex.reduce((a,x)=>a+x[1]*1.5,0));
const dow=()=>new Date().getDay();
const tk=()=>kf(new Date());
function weekStart(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x}
function sessionsIn(a,b){return Object.entries(S.done).filter(([k])=>{const d=new Date(k+'T00:00:00');return d>=a&&d<b}).map(e=>e[1])}
function streak(){let n=0,d=new Date();for(let i=0;i<400;i++){const w=W[d.getDay()];if(w){if(S.done[kf(d)])n++;else if(i>0)break}d.setDate(d.getDate()-1)}return n}
const NAV=[['home','🏠','Home'],['work','🏋️','Workouts'],['food','🥗','Nutrition'],['prog','📈','Progress'],['set','👤','Me']];
function drawNav(){$('#nav').innerHTML=NAV.map(n=>`<button class="${tab===n[0]?'on':''}" data-t="${n[0]}" aria-label="${n[2]}"><i>${n[1]}</i>${n[2]}</button>`).join('')}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;render();scrollTo(0,0)}};
function exList(w){return w.ex.map(x=>`<div class="ex"><b>${E[x[0]][1]} ${E[x[0]][0]}</b><span>${x[1]} × ${x[2]}${x[3]||''}</span></div>`).join('')}
function home(){
 const d=new Date(),w=W[d.getDay()],done=S.done[tk()];
 const date=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
 let h=`<div class="mut">${date}</div>`;
 if(w){h+=`<h1>${w.e} ${w.n}</h1><span class="pill">Training day</span>
 <div class="card hero"><div class="mut">Estimated time</div><h3>About ${wmin(w)} minutes including warm-up</h3>${exList(w)}
 ${done?'<p style="color:var(--g);font-weight:700;margin:12px 0 0">✅ Completed today. Great work!</p>':'<button class="p big" id="go">START WORKOUT</button>'}</div>`}
 else h+=`<h1>😴 Recovery Day</h1><span class="pill rest">Rest day</span>
 <div class="card hero"><h3>Your body grows stronger while you rest</h3><p class="mut">Eat balanced meals, drink water, sleep well, and do some light stretching or a walk if you feel like it.</p></div>`;
 h+=homeX();h+=`<div class="card"><div class="mut">Today’s motivation</div><h3>${MOT[Math.floor(d/864e5)%MOT.length]}</h3></div>`;
 const n=S.notif;
 if(!n.on)h+=`<div class="card"><h3>🔔 Want a daily reminder?</h3><p class="mut">Set your time in Settings.</p></div>`;
 return h}
function work(){
 let h='<h1>Workouts</h1><div class="mut">Your fixed weekly schedule</div>';
 for(const i of [1,2,3,4,5,6,0]){const w=W[i];
  h+=w?`<details ${i===dow()?'open':''}><summary>${DN[i]} · ${w.n}</summary>${exList(w)}<p class="mut">About ${wmin(w)} min</p>${i===dow()&&!S.done[tk()]?'<button class="p" id="go">Start workout</button>':''}</details>`
  :`<details><summary>${DN[i]} · Rest day 😴</summary><p class="mut">Recovery. Eat well, hydrate, sleep.</p></details>`}
 return h+'<div class="card warn"><b>Safety first.</b> Stop if anything hurts (sharp or joint pain, dizziness). Tiredness is okay, pain is not. Tell a parent or coach if it continues.</div>'}
function plan(){
 const w=W[dow()];
 if(w&&!S.done[tk()]&&!unlock)return `<h1>Nutrition</h1><div class="card"><h3>🔒 Unlocks after today’s workout</h3><p class="mut">Finish your session and your meal plan appears here.</p><button id="peek">Preview meals anyway</button></div>`;
 let h='<h1>Today’s meals</h1><div class="mut">Balanced, affordable food. Eat until you feel satisfied.</div>'+(W[dow()]?'<div class="card">🏋️ Training day: include carbohydrates and protein in your meals (rice, bread, eggs, yogurt, chicken) and enjoy a snack after training.</div>':'<div class="card">😴 Rest day: eat the same balanced meals. Your body repairs and grows while you rest.</div>');
 if(S.allergies)h+=`<div class="card warn">⚠️ Your allergies: ${esc(S.allergies)}. Swap any meal item that contains them.</div>`;
 if(S.prefs)h+=`<div class="card"><b>Your preferences:</b> ${esc(S.prefs)}</div>`;
 MEALS.forEach(m=>{h+=`<div class="card"><div class="row"><div style="font-size:44px;flex:0 0 60px">${m[1]}</div><div><div class="mut">${m[0]}</div><h3>${m[2]}</h3></div></div>
 <p><b>Ingredients:</b> ${m[3]}</p><p><b>How:</b> ${m[4]}</p><p class="mut"><b>Alternatives:</b> ${m[5]}</p></div>`});
 return h+'<div class="card">💧 <b>Hydration:</b> sip water through the day, especially around training. Growing bodies need enough food, so never skip meals or diet. If you have health questions, ask a doctor.</div>'}
function prog(){
 const ds=Object.keys(S.done),now=new Date(),ws=weekStart(now),nx=new Date(ws);nx.setDate(nx.getDate()+7);const pv=new Date(ws);pv.setDate(pv.getDate()-7);
 const tw=sessionsIn(ws,nx),lw=sessionsIn(pv,ws),reps=a=>a.reduce((s,x)=>s+(x.reps||0),0);
 const exs=Object.values(S.done).reduce((s,x)=>s+(x.ex||0),0);
 let cal='';for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(d.getDate()+i);const k=kf(d),w=W[d.getDay()];
  cal+=`<div class="${S.done[k]?'d':''} ${k===tk()?'t':''}">${'MTWTFSS'[i]}<div>${S.done[k]?'✓':w?'•':'z'}</div></div>`}
 const diff=reps(tw)-reps(lw);
 const last=ds.sort().reverse().slice(0,5).map(k=>`<div class="ex"><b>${new Date(k+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · ${S.done[k].n}</b><span>${S.done[k].feel||'✓'}</span></div>`).join('')||'<p class="mut">No workouts yet. Your first one will appear here.</p>';
 return `<h1>Progress</h1><div class="mut">Your journey, at your own pace</div>
 <div class="grid" style="margin-top:12px"><div class="card stat"><b>${ds.length}</b>workouts done</div><div class="card stat"><b>${streak()}</b>workout streak</div><div class="card stat"><b>${exs}</b>exercises done</div><div class="card stat"><b>${tw.length}/4</b>this week</div></div>
 <h2>This week</h2><div class="card"><div class="wk">${cal}</div><p class="mut" style="margin:12px 0 0">z = rest day</p></div>
 <h2>Weekly summary</h2><div class="card"><p style="margin:0">${tw.length} workout${tw.length==1?'':'s'} and ${reps(tw)} reps this week.</p><p class="mut" style="margin:6px 0 0">${lw.length?(diff>0?`That’s ${diff} more reps than last week. Nice improvement!`:diff<0?'Fewer reps than last week, and that’s fine. Rest and recovery matter too.':'Same as last week. Steady work!'):'Complete a full week to see your improvement.'}</p></div>
 <h2>Recent workouts</h2><div class="card">${last}</div>`}
function settings(){
 const n=S.notif,ok='Notification' in window,p=ok?Notification.permission:'unsupported';
 return `<h1>Settings</h1>
 ${notifUI()}<h2>Food</h2><div class="card"><label class="mut" for="al">Food allergies</label><input type="text" id="al" value="${esc(S.allergies)}" placeholder="e.g. nuts, eggs">
 <label class="mut" for="pf" style="display:block;margin-top:10px">Preferences</label><input type="text" id="pf" value="${esc(S.prefs)}" placeholder="e.g. no fish, halal only"><button id="sf" style="width:100%;margin-top:12px">Save</button></div>
 <h2>Your data</h2><div class="card"><p class="mut">Everything is stored on this device only, so clearing browser data erases it.</p><button id="rs" style="width:100%">Reset all progress</button></div>`}
function render(){drawNav();$('#app').innerHTML={home,work,food,prog:()=>prog()+report(),set:()=>me()+settings()}[tab]();bind()}
function bind(){
 const g=$('#go');if(g)g.onclick=startRun;
 const pk=$('#peek');if(pk)pk.onclick=()=>{unlock=true;render()};
 const en=$('#en');if(en)en.onclick=async()=>{
  S.notif.time=$('#tm').value||'18:00';
  if(!('Notification' in window)){$('#nm').textContent='This browser does not support notifications. On iPhone, add the app to your Home Screen first.';return}
  try{const p=await Notification.requestPermission();if(p==='granted'){S.notif.on=true;save();render()}else $('#nm').textContent='Permission '+p+'. Allow notifications for this site in your phone settings.'}catch(e){$('#nm').textContent='Could not request permission: '+e.message}};
 const off=$('#off');if(off)off.onclick=()=>{S.notif.on=false;save();render()};
 const sf=$('#sf');if(sf)sf.onclick=()=>{S.allergies=$('#al').value.trim();S.prefs=$('#pf').value.trim();save();sf.textContent='Saved ✓'};
 const rs=$('#rs');if(rs)rs.onclick=()=>{if(confirm('Delete all your progress?')){S.done={};save();render()}}}
/* Profile, food log, weekly report */
const FD=[['Egg, boiled','1 egg',78,6.3,.6,5.3,0,25,.9],['Milk','1 glass (250 ml)',150,8,12,8,0,300,.1],['Plain yogurt','1 pot (125 g)',75,4.3,6,4,0,150,.1],['Banana','1 medium',105,1.3,27,.4,3.1,6,.3],['Apple','1 medium',95,.5,25,.3,4.4,11,.2],['Orange','1 medium',62,1.2,15,.2,3.1,52,.1],['Bread','1 slice (30 g)',80,2.7,15,1,.8,null,null],['Rice, cooked','1 cup',205,4.3,45,.4,.6,null,null],['Potato, boiled','1 medium',130,3,30,.2,2.5,null,null],['Chicken breast, cooked','100 g',165,31,0,3.6,0,15,1],['White fish, cooked','100 g',105,23,0,1,0,null,null],['Sardines, canned','100 g',208,25,0,11,0,382,2.9],['Lentils, cooked','1 cup',230,18,40,.8,15.6,38,6.6],['Chickpeas, cooked','1 cup',269,14.5,45,4.2,12.5,80,4.7],['Lentil soup','1 bowl',180,11,28,3,8,null,null],['Almonds','1 handful (28 g)',164,6,6,14,3.5,76,1],['Mixed nuts','1 handful (30 g)',180,5,6,16,2.5,null,null],['Peanut butter','1 tbsp',95,3.6,3.5,8,1,null,null],['Carrot','1 medium',25,.6,6,.1,1.7,20,.2],['Tomato','1 medium',22,1.1,4.8,.2,1.5,12,.3],['Vegetables or salad','1 bowl',50,2,10,.5,4,null,null],['Olive oil','1 tbsp',119,0,0,13.5,0,null,null],['Oats, dry','40 g',150,5,27,2.7,4,null,null],['Cheese','1 slice (20 g)',75,5,.4,6,0,null,null],['Dates','3 small',70,.5,19,0,2,null,null]];
const allF=()=>FD.concat(S.cf);
const dl=k=>S.log[k]||[];
const sum=a=>{const t=[0,0,0,0,0,0,0];a.forEach(e=>e.v.forEach((x,i)=>{if(x!=null)t[i]+=x}));return t};
const ref=a=>a<=13?[1400,2600]:a==14?[1800,2800]:[1800,3200];
const dd=s=>new Date(s+'T00:00:00');

  h+=`<h1>Warm-up</h1><div class="mut">About 5 minutes. Move gently.</div><div class="card">${WARM.map(x=>`<div class="ex"><b>${x[0]}</b><span style="color:var(--mut);font-weight:400;white-space:normal;text-align:right">${x[1]}</span></div>`).join('')}</div><button class="p" id="nx">Warm-up done, start exercises</button>`}

 const skip=b('#skip');if(skip)skip.onclick=()=>{clearInterval(T);R.rest=0;drawRun()};

const u8=b=>{const s=atob((b+'='.repeat((4-b.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...s].map(c=>c.charCodeAt(0)))};

async function pushInit(){
 PS.sup='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
 PS.inst=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
 PS.perm='Notification' in window?Notification.permission:'unsupported';
 try{if('serviceWorker' in navigator){const r=await navigator.serviceWorker.register('/sw.js');
  if(PS.sup){const s=await r.pushManager.getSubscription();PS.sub=!!s;if(s&&PS.perm==='granted')post('/api/subscribe',{subscription:s,time:S.notif.time,tz:tzn()}).catch(()=>{})}}}
 catch(e){PS.msg='Offline mode and push need the deployed server ('+e.message+')'}

async function enablePush(){
 const t=$('#ptm');if(t&&t.value){S.notif.time=t.value;save()}
 PS.busy=true;PS.msg='';render();
 try{
  const perm=await Notification.requestPermission();PS.perm=perm;
  if(perm!=='granted')throw new Error(perm==='denied'?'Notifications are blocked. See the steps below.':'Permission was not given.');
  const k=await fetch('/api/vapid-public-key');if(!k.ok)throw new Error('Push server not reachable ('+k.status+').');
  const reg=await navigator.serviceWorker.ready;
  const sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8((await k.json()).key)});
  const r=await post('/api/subscribe',{subscription:sub,time:S.notif.time,tz:tzn()});
  if(!r.ok)throw new Error('Server rejected the subscription ('+r.status+').');
  PS.sub=true;PS.msg='Reminders are on for '+S.notif.time+'.'
 }catch(e){PS.msg=e.message}
 PS.busy=false;render()}
$('#app').addEventListener('click',async e=>{const b=e.target.closest('[data-p]');if(!b)return;const a=b.dataset.p;

 if(a==='on')return enablePush();
 try{const reg=await navigator.serviceWorker.ready,s=await reg.pushManager.getSubscription();
  if(a==='time'){S.notif.time=$('#ptm').value||'18:00';save();if(!s)throw new Error('Not subscribed.');const r=await post('/api/subscribe',{subscription:s,time:S.notif.time,tz:tzn()});if(!r.ok)throw new Error('Server error '+r.status);PS.msg='Time saved: '+S.notif.time}
  else if(a==='off'){if(s){await post('/api/unsubscribe',{endpoint:s.endpoint});await s.unsubscribe()}PS.sub=false;PS.msg='Reminders turned off.'}
  else if(a==='test'){const r=await post('/api/test',{endpoint:s.endpoint});const j=await r.json().catch(()=>({}));PS.msg=r.ok?'Test sent by the server. It should arrive in a few seconds.':'Test failed: '+(j.error||r.status)}
 }catch(err){PS.msg=err.message}
 render()});

 else b=`${tin}<button class="p big" data-p="on" ${PS.busy?'disabled':''}>ENABLE NOTIFICATIONS</button>`;
 return `<h2>Daily reminders</h2><div class="card"><p style="margin-top:0">One short message a day tells you if it’s a workout or rest day, even when the app is closed. You choose the time, and you can turn it off anytime.</p>${b}${PS.msg?`<p style="color:var(--g)">${esc(PS.msg)}</p>`:''}<p class="mut" style="margin-bottom:0">Status: permission ${st}, ${PS.sub?'subscribed on server':'not subscribed'}.${PS.inst?'':' Not running from the Home Screen.'}</p></div>`}
function pushPrompt(){return PS.sub&&PS.perm==='granted'?'':`<div class="card hero"><h3>🔔 Get your daily workout reminder</h3><p class="mut">Know your workout before you open the app.</p><button class="p" data-p="go">Set up notifications</button></div>`}
render();pushInit();

</script></body></html>
